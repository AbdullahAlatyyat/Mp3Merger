name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild Mp3Merger.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package build output
        shell: pwsh
        run: |
          $dest = "dist/Mp3Merger"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "Mp3Merger/bin/Release/*" -Destination $dest -Recurse
          Compress-Archive -Path "$dest/*" -DestinationPath "Mp3Merger.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Mp3Merger.zip
          generate_release_notes: true
